[package]
name = "imajev-rs"
version = "0.1.0"
edition = "2021"
description = "Rust (candle) inference for the Imajev image decision model: typed answers with probabilities and an explicit can't-tell"
license = "Apache-2.0"
repository = "https://github.com/apiplant/imajev-rs"
homepage = "https://imajev-rs.apiplant.com"
readme = "README.md"
keywords = ["imajev", "decision-model", "vision-language", "candle", "inference"]
categories = ["science", "command-line-utilities"]
exclude = ["/website/", "/packaging/", "/.github/"]

[lib]
name = "imajev_rs"

[[bin]]
name = "imajev"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1"
candle-core = "0.9.2"
candle-nn = "0.9.2"
clap = { version = "4", features = ["derive", "env"], optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokenizers = "0.21"
ureq = "2"
axum = { version = "0.8", features = ["multipart"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal"], optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[features]
# `cli` and `server` are on by default so `cargo install` gives the full `imajev` binary. A library
# dependency that only wants the engine should turn them off, which drops clap, axum and tokio:
#   imajev-rs = { version = "...", default-features = false }
default = ["cli", "server"]
# Command-line parsing for the `imajev` binary.
cli = ["dep:clap"]
# The HTTP server (`imajev_rs::server`, `imajev serve`).
server = ["dep:axum", "dep:tokio"]
# CUDA: the model is built for it (fused Gated DeltaNet kernels); the CPU path is a slow reference.
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[[test]]
name = "server"
required-features = ["server"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
